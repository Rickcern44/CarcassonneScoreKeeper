name: Release

# Promotes a ref (main by default) to production: migrates the production
# database, deploys to Fly.io, then tears the ephemeral staging environment
# down. Started by hand from the Actions tab once staging looks right.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to release (the one staging is running)
        default: main
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Migrate and deploy production
    runs-on: ubuntu-latest
    environment: production
    # Never run two releases at once, and never cancel one half way.
    concurrency:
      group: release-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Runtime dependencies are all the migration script needs.
      - run: npm ci --omit=dev

      - name: Read the app name from fly.toml
        run: echo "APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)" >> "$GITHUB_ENV"

      # Applies any new Drizzle migrations to Neon. A failure stops the release
      # before the new code ships. Uses MIGRATE_DATABASE_URL (Neon's direct,
      # non-pooled string) when set, else DATABASE_URL.
      - name: Migrate the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          : "${MIGRATE_DATABASE_URL:-${DATABASE_URL:?Set the DATABASE_URL repository secret}}"
          node scripts/migrate.mjs

      - uses: ./.github/actions/fly-deploy
        with:
          app: ${{ env.APP }}
          org: ${{ vars.FLY_ORG || 'personal' }}
          token: ${{ secrets.FLY_API_TOKEN }}
          app-password: ${{ secrets.APP_PASSWORD }}
          database-url: ${{ secrets.DATABASE_URL }}

  teardown:
    name: Tear down staging
    needs: release
    uses: ./.github/workflows/staging-teardown.yml
    secrets: inherit

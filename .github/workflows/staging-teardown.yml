name: Staging teardown

# Destroys the ephemeral staging environment: the Fly app and the Neon branch.
# Called by release.yml after a production release, and can be run by hand.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  teardown:
    name: Destroy staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy the staging Fly app
        run: |
          app="$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)-staging"
          if flyctl status --app "$app" > /dev/null 2>&1; then
            flyctl apps destroy "$app" --yes
          else
            echo "No Fly app named $app; nothing to destroy."
          fi

      - name: Delete the staging Neon branch
        run: scripts/neon-delete-branch.sh staging

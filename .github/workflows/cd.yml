name: CD

# Runs on every merge to main: the full CI workflow first, then an ephemeral
# staging environment is built from the merge. Staging is a Neon branch of the
# production database plus a separate Fly app. Production is released by hand
# with release.yml, which also tears staging down.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    # One staging at a time; a newer merge waits, it never cancels a deploy.
    concurrency:
      group: staging
      cancel-in-progress: false
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev

      - name: Read the app name from fly.toml
        run: echo "APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)-staging" >> "$GITHUB_ENV"

      # Start from a fresh copy of production on every merge. The branch also
      # expires on its own after two weeks if nobody promotes or tears it down.
      - name: Drop the previous staging branch
        run: scripts/neon-delete-branch.sh staging

      - name: Work out the branch expiry
        run: echo "EXPIRES_AT=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Branch the production database
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: staging
          expires_at: ${{ env.EXPIRES_AT }}

      # Rehearses the migration on a copy of the real data before production.
      - name: Migrate the staging database
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: node scripts/migrate.mjs

      - uses: ./.github/actions/fly-deploy
        with:
          app: ${{ env.APP }}
          org: ${{ vars.FLY_ORG || 'personal' }}
          token: ${{ secrets.FLY_API_TOKEN }}
          app-password: ${{ secrets.APP_PASSWORD }}
          database-url: ${{ steps.neon.outputs.db_url_pooled }}

      - name: Summary
        run: echo "Staging is live at https://$APP.fly.dev/ - promote it with the Release workflow." | tee -a "$GITHUB_STEP_SUMMARY"

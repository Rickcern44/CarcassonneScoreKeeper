name: CD

# Runs on every merge to main: CI, then an ephemeral staging environment (a Neon
# branch of the production database plus a separate Fly app), then production
# once someone approves it (required reviewers on the `production` environment),
# then staging is torn down.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One pipeline at a time, so staging always shows what is waiting for approval.
# A newer merge waits until this run is approved, rejected or finished.
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    name: Deploy staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev

      - name: Read the app name from fly.toml
        run: echo "APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)-staging" >> "$GITHUB_ENV"

      # Start from a fresh copy of production on every merge. The branch also
      # expires on its own after two weeks if nobody promotes or tears it down.
      - name: Drop the previous staging branch
        run: scripts/neon-delete-branch.sh staging

      - name: Work out the branch expiry
        run: echo "EXPIRES_AT=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Branch the production database
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: staging
          expires_at: ${{ env.EXPIRES_AT }}

      # Rehearses the migration on a copy of the real data before production.
      - name: Migrate the staging database
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: node scripts/migrate.mjs

      - uses: ./.github/actions/fly-deploy
        with:
          app: ${{ env.APP }}
          org: ${{ vars.FLY_ORG || 'personal' }}
          token: ${{ secrets.FLY_API_TOKEN }}
          app-password: ${{ secrets.APP_PASSWORD }}
          database-url: ${{ steps.neon.outputs.db_url_pooled }}

      - name: Summary
        run: echo "Staging is live at https://$APP.fly.dev/ - approve the production deployment when it looks right." | tee -a "$GITHUB_STEP_SUMMARY"

  production:
    name: Migrate and deploy production
    needs: staging
    runs-on: ubuntu-latest
    # Required reviewers on this environment hold the job until approved.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Runtime dependencies are all the migration script needs.
      - run: npm ci --omit=dev

      - name: Read the app name from fly.toml
        run: echo "APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)" >> "$GITHUB_ENV"

      # Applies any new Drizzle migrations to Neon. A failure stops the release
      # before the new code ships. Uses MIGRATE_DATABASE_URL (Neon's direct,
      # non-pooled string) when set, else DATABASE_URL.
      - name: Migrate the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          : "${MIGRATE_DATABASE_URL:-${DATABASE_URL:?Set the DATABASE_URL repository secret}}"
          node scripts/migrate.mjs

      - uses: ./.github/actions/fly-deploy
        with:
          app: ${{ env.APP }}
          org: ${{ vars.FLY_ORG || 'personal' }}
          token: ${{ secrets.FLY_API_TOKEN }}
          app-password: ${{ secrets.APP_PASSWORD }}
          database-url: ${{ secrets.DATABASE_URL }}

  teardown:
    name: Tear down staging
    needs: production
    uses: ./.github/workflows/staging-teardown.yml
    secrets: inherit

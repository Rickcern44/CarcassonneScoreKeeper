<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		>
		<meta name="color-scheme" content="light dark">
		<title>Offline · Carc Keeper</title>
		<style>
		:root {
			--bg: #f5f0e4;
			--ink: #2a2220;
			--muted: #6b5e52;
			--yellow: #f2b632;
			--shadow: #2a2220;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #16130f;
				--ink: #f4eee2;
				--muted: #a89f90;
				--shadow: #0b0906;
			}
		}
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			padding: 24px;
			box-sizing: border-box;
			background: var(--bg);
			color: var(--ink);
			font-family: Nunito, system-ui, sans-serif;
		}
		main {
			max-width: 28rem;
			margin: 0 auto;
			width: 100%;
		}
		h1 {
			margin: 0;
			font-family: Fredoka, Nunito, system-ui, sans-serif;
			font-size: 2.25rem;
			line-height: 1.1;
		}
		p {
			margin: 12px 0 0;
			font-size: 1.125rem;
			font-weight: 600;
			color: var(--muted);
		}
		button {
			margin-top: 28px;
			width: 100%;
			min-height: 48px;
			border: 2px solid var(--shadow);
			border-radius: 16px;
			background: var(--yellow);
			color: #2a2220;
			font:
				600 1.125rem Fredoka,
				Nunito,
				system-ui,
				sans-serif;
			box-shadow: 0 4px 0 0 var(--shadow);
			cursor: pointer;
		}
		</style>
	</head>
	<body>
		<main>
			<h1>You're offline</h1>
			<p>
				This page hasn't been saved on this device yet. Reconnect and try again;
				pages you've already opened stay available.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
